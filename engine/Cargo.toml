# NOTE: manifest values are inline (not workspace-inherited) so the engine
# builds standalone inside the Buildroot OS image pipeline (os/build.sh),
# where the root dev workspace is not visible.
[package]
name = "markos-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MarkOS inference engine: custom serving layer, OpenAI-compatible API, admin control plane and embedded web UI"

[[bin]]
name = "markos-engine"
path = "src/main.rs"

[features]
default = ["mock-backend"]
# Deterministic mock backend for host builds/tests/CI (no model needed).
# The MarkOS OS image builds with default-features=false, features=["llama","tls"].
mock-backend = []
# Real tensor backend: llama.cpp/ggml via llama-cpp-2.
llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
# TLS for the web UI / API (rustls + first-boot self-signed certs).
tls = ["dep:rustls", "dep:rcgen", "dep:rustls-pemfile"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
getrandom = "0.2"
minijinja = "2"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
# default-features = false drops llama-cpp-2's `openmp` default: the Buildroot
# aarch64 toolchain ships no libgomp, and OpenMP buys nothing on a 4-core
# appliance (ggml's own thread pool handles the 4 A76 cores).
llama-cpp-2 = { version = "0.1", optional = true, default-features = false }
llama-cpp-sys-2 = { version = "0.1", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "logging", "std"] }
rcgen = { version = "0.13", optional = true }
rustls-pemfile = { version = "2", optional = true }
