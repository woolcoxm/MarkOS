#!/usr/sbin/nft -f
# MarkOS appliance firewall: deny-by-default inbound.
# 22:   dropbear SSH (only listening if enabled at install)
# 80:   web UI
# 4444: web UI rescue listener (also reachable via 169.254.9.1)
# 8080: OpenAI-compatible inference API
# 5353/udp: mDNS discovery

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;

		ct state established,related accept
		ct state invalid drop

		iifname "lo" accept

		ip protocol icmp icmp type echo-request accept
		ip6 nexthdr icmpv6 icmpv6 type echo-request accept

		tcp dport { 22, 80, 4444, 8080 } accept
		udp dport 5353 accept

		# link-local rescue subnet
		ip saddr 169.254.0.0/16 accept
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}
}
