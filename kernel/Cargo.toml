[package]
name = "markos-kernel"
version = "0.1.0"
edition = "2024"
description = "MarkOS: bare-metal Raspberry Pi unikernel for LLM inference (AArch64)"

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
# Deliberately dependency-free at bring-up; platform crates are added only
# when a phase actually needs them.

# Acceptance-test builds; never enabled by default.
[features]
selftest-exceptions = []
