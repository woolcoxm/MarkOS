[package]
name = "markos-kernel"
version = "0.1.0"
edition = "2024"
description = "MarkOS: single-purpose x86_64 unikernel for LLM inference"

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
limine = "0.6"
x86_64 = "0.15"
spin = "0.10"

# Deliberate-fault acceptance tests (Phase 1); never enabled by default.
[features]
selftest-div = []
selftest-pf = []
selftest-frames = []
