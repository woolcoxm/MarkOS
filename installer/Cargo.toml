[package]
name = "markos-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MarkOS image installer/configurator: GUI (egui) + scriptable CLI, validates config, injects provision files into the image and flashes boot media"

[[bin]]
name = "markos-installer"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_plot"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
getrandom = "0.2"
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.29", optional = true }
egui_plot = { version = "0.29", optional = true }
